<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 512px; height: 512px; overflow: hidden; background: #0b0618; font-family: Impact, "Arial Black", sans-serif; }
  .bg { position: absolute; inset: 0;
    background:
      radial-gradient(circle at 30% 80%, rgba(255, 0, 120, .6), transparent 55%),
      radial-gradient(circle at 75% 25%, rgba(0, 200, 255, .55), transparent 55%),
      linear-gradient(135deg, #1a0a3a, #0b0618 60%, #001a2e); }
  .rays { position: absolute; inset: -200px; background: repeating-conic-gradient(from 0deg at 50% 50%, rgba(255,255,255,.07) 0deg 8deg, transparent 8deg 18deg); }

  .char { position: absolute; left: 150px; top: 150px; width: 220px; height: 300px; transform: rotate(-6deg); }
  .char .head { position: absolute; left: 35px; top: 0; width: 150px; height: 150px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff, #ff00ff 55%, #000 130%); box-shadow: 0 0 40px #ff00ff; }
  .char .body { position: absolute; left: 10px; top: 130px; width: 200px; height: 170px; border-radius: 22px;
    background: linear-gradient(160deg, #2a2a2a, #000); box-shadow: 0 0 60px #ff00ff, 0 0 120px #ff00ff, inset 0 -20px 40px rgba(0,0,0,.4); }
  .eye { position: absolute; top: 50px; width: 28px; height: 40px; background: #000; border-radius: 50%; }
  .eye.l { left: 70px; } .eye.r { left: 125px; }
  .eye::after { content: ""; position: absolute; left: 6px; top: 6px; width: 10px; height: 12px; background: #fff; border-radius: 50%; }
  .mouth { position: absolute; width: 40px; height: 48px; left: 92px; top: 92px; border-radius: 50%; background: #000; }

  .hand { position: absolute; left: 330px; top: 90px; font-family: "Segoe UI Emoji"; font-size: 150px; transform: rotate(-75deg) scaleX(-1); filter: drop-shadow(0 0 20px #ff4b4b); }

  .t1 { position: absolute; left: 0; right: 0; top: 18px; text-align: center; font-size: 96px; line-height: 1; color: #ffd400;
    -webkit-text-stroke: 5px #000; paint-order: stroke fill; text-shadow: 0 0 25px rgba(255,212,0,.9); transform: rotate(-4deg); }
  .t2 { position: absolute; left: 0; right: 0; bottom: 8px; text-align: center; font-size: 150px; line-height: 1; color: #fff;
    -webkit-text-stroke: 7px #000; paint-order: stroke fill; text-shadow: 0 0 30px rgba(255,255,255,.7); transform: rotate(-4deg); }
  .coin { position: absolute; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff6a8, #ffd400 45%, #b8860b 100%); border: 4px solid #000; box-shadow: 0 0 20px #ffd400; }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="rays"></div>
  <div class="char"><div class="head"><div class="eye l"></div><div class="eye r"></div><div class="mouth"></div></div><div class="body"></div></div>
  <div class="hand">🫳</div>
  <div class="coin" style="left:60px; top:230px; width:56px; height:56px;"></div>
  <div class="coin" style="left:100px; top:320px; width:38px; height:38px;"></div>
  <div class="coin" style="left:420px; top:190px; width:48px; height:48px;"></div>
  <div class="t1">STEAL THE</div>
  <div class="t2">CLOUT</div>
</body>
</html>
